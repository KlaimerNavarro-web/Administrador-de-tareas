<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="main-container">
        <h2> 🚀 Task Manager</h2>
        <p id="task-counter">📌 Tareas: 0</p>
        <button id="theme-toggle">🌙 Modo oscuro</button>

        <form onsubmit="handleFormSubmit(event)">
            <input required type="text" placeholder="Title" name="title">

            <textarea
                placeholder="Add the task description"
                name="description"
                rows="5"></textarea>
                <select name="priority">
                <option value="🔥Importante">🔥 Importante</option>
                <option value="📌Normal">📌 Normal</option>
                <option value="💤Opcional">💤 Opcional</option>
            </select>

            <button type="submit">Submit</button>

            <!-- Mensaje de error -->
            <p id="error-message" class="error-message"></p>
        </form>

        <ul id="task-list-container" class="task-list"></ul>
    </div>

    <script src="./index.js"></script>
</body>

</html>
